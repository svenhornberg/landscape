[package]
name = "bplan"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Bebauungsplan (Aufgabe x Abteilung -> System) aus versionierten Textdateien"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

# Zielgroesse laut SPEC.md unter 10 MB.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
